[project]
name = "exhibitflow-lite"
version = "0.1.0"
description = "Lightweight exhibition short-video workflow: social search, preview, download, Qwen helpers, and publish wrappers."
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.35",
  "requests>=2.31",
  "openai>=1.0",
  "python-dotenv>=1.0",
  "edge-tts>=6.1",
]

[project.optional-dependencies]
# PyCaps is kept optional because its browser/Pictex renderers are still alpha.
# The default renderer remains available on small hosts, while installing this
# extra enables the real character-level Chromium export used by the
# ``pycaps_hype`` template.
caption-preview = [
  "pycaps @ git+https://github.com/francozanardi/pycaps.git",
  "playwright>=1.40",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["exhibitflow_lite"]
